<html>
    <head>
        <title>Mouse Events</title>
        <style>
            #mouseBox{
                width: 200px;
                height:auto;
                margin: 10px;
                padding: 20px;
                border:2px solid black;
                text-align:center;
            }
        </style>
    </head>
</html>
<body>
    <h1>Mouse Events</h1>
    <div id="mouseBox"
        onmouseover="mouseOver()"
        onmouseout="mouseOut()"
        onclick="mouseClick()"
        ondblclick="mouseDblclick()"
        onmousedown="mouseDown()"
        onmouseup="mouseUp()">
        Hover or Click 
    </div>
    <script>
        function mouseOver(){
            document.getElementById("mouseBox").style.backgroundColor="red";
        }
        function mouseOut(){
             document.getElementById("mouseBox").style.backgroundColor="lightblue";
        }
        function mouseClick(){
            alert("Mouse Clicked");
        }
        function mouseDblClick(){
            alert("Mouse Double Clicked");
         }
        function mouseDown(){
            document.getElementById("mouseBox").style.border="5px solid lightblue";
        }
        function mouseUp(){
            document.getElementById("mouseBox").style.border="5px solid blue";
        }
    </script>
        
</body>
</html>
